<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <title>krog-gpt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">K</div>
        <div>
          <h1>krog-gpt</h1>
          <small>Your personal AI chatbot</small>
        </div>
      </div>
      <button class="ghost" id="clear" type="button">New chat</button>
    </header>

    <section id="log" aria-label="Conversation" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">K</div>
        <h2>Hi, I’m krog-gpt 👋</h2>
        <p>Ask me anything. What are we figuring out today?</p>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <div class="composer-wrap">
      <form id="composer">
        <label class="sr-only" for="message">Message krog-gpt</label>
        <textarea id="message" rows="1" maxlength="4000" placeholder="Message krog-gpt…" autocomplete="off"></textarea>
        <button id="send" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg>
        </button>
      </form>
      <p class="disclaimer">krog-gpt can make mistakes. Check important information.</p>
    </div>
  </main>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
